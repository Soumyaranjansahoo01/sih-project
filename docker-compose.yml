version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sih26027_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ir_planner
      POSTGRES_PASSWORD: ir_password
      POSTGRES_DB: ir_block_planning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ir_planner -d ir_block_planning"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sih26027_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://ir_planner:ir_password@db:5432/ir_block_planning
      - APP_ENV=production
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: sih26027_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
